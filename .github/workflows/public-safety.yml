name: Public Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Reject internal development files
        shell: bash
        run: |
          blocked="$(git ls-files | grep -E '^(report/|todo/|CLAUDE\.md$|PROGRESS_REPORT_|\.agents/|\.codex/|session-handoff-)' || true)"
          if [[ -n "$blocked" ]]; then
            echo "Internal development files must not be published:"
            echo "$blocked"
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Gitleaks 8.30.1
        shell: bash
        run: |
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfLO "$base/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${version}_checksums.txt"
          grep "gitleaks_${version}_linux_x64.tar.gz" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks

      - name: Scan Git history for secrets
        run: ./gitleaks git . --redact --exit-code 1
